spring:
  application:
    name: razorfy-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorfy}
    username: ${DB_USERNAME:razorfy}
    password: ${DB_PASSWORD:razorfy}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

razorfy:
  timezone: ${BUSINESS_TIMEZONE:America/Sao_Paulo}
  cashback-rate: ${CASHBACK_RATE:0.05}
  payment-hold-minutes: ${PAYMENT_HOLD_MINUTES:10}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-bytes}
    client-expiration-hours: 24
    staff-expiration-hours: 8
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  notifications:
    whatsapp-url: ${WHATSAPP_GATEWAY_URL:}
    max-attempts: 5
  bootstrap:
    enabled: ${DEV_BOOTSTRAP_ENABLED:false}
    admin-email: ${DEV_ADMIN_EMAIL:admin@razorfy.local}
    admin-password: ${DEV_ADMIN_PASSWORD:}
    staff-password: ${DEV_STAFF_PASSWORD:}

logging:
  level:
    root: INFO
  structured:
    format:
      console: logstash
