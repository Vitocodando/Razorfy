name: razorfy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: razorfy
      POSTGRES_USER: razorfy
      POSTGRES_PASSWORD: razorfy
    ports:
      - "5432:5432"
    volumes:
      - razorfy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorfy -d razorfy"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://razorfy:razorfy@postgres:5432/razorfy
      JWT_SECRET: local-development-secret-change-before-production-2026
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      DEV_BOOTSTRAP_ENABLED: "true"
      DEV_ADMIN_EMAIL: admin@razorfy.local
      DEV_ADMIN_PASSWORD: Admin@123
      DEV_STAFF_PASSWORD: Barber@123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  razorfy_postgres:
