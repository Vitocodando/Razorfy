<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Listras diagonais do poste de barbeiro (vermelho / branco / azul) -->
    <pattern id="barberStripes" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="48" height="48" fill="#ffffff"/>
      <rect width="16" height="48" x="0" fill="#E0392E"/>
      <rect width="16" height="48" x="24" fill="#2B3892"/>
    </pattern>
    <clipPath id="poleClip">
      <rect x="206" y="222" width="100" height="188" rx="8"/>
    </clipPath>
  </defs>

  <!-- Esfera (topo) -->
  <circle cx="256" cy="140" r="48" fill="#CDD6DC"/>

  <!-- Tampa superior -->
  <rect x="184" y="188" width="144" height="34" rx="17" fill="#95A3AF"/>

  <!-- Corpo com listras -->
  <g clip-path="url(#poleClip)">
    <rect x="206" y="222" width="100" height="188" fill="url(#barberStripes)"/>
  </g>

  <!-- Tampa inferior -->
  <rect x="184" y="410" width="144" height="34" rx="17" fill="#95A3AF"/>
</svg>
